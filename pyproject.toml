[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "craft-agent-harness"
version = "0.1.0"
description = "Capability discovery, durable tasks, multi-agent orchestration, evaluation, and reusable workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
craft = "craft_core.cli:main"
craft-mcp = "craft_core.mcp:main"
craft-install = "craft_core.installer:main"

[project.optional-dependencies]
dev = ["coverage[toml]>=7.6", "PyYAML>=6.0"]

[tool.coverage.run]
branch = true
source = ["craft_core"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.setuptools]
packages = ["craft_core"]
