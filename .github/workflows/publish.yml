name: publish

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # Pinned to the v4 commits resolved from each publisher repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          # Keep release installs reproducible with package.json.
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm test` already runs version:check, but a release that publishes a
      # version no other manifest agrees with is worth failing loudly and early.
      - run: pnpm run version:check
      - run: pnpm test
      # Publish bottom-up so every package dependency is resolvable when the
      # root harness is published. npm trusted publishing must be configured
      # for these package names before the release workflow is enabled.
      - run: pnpm --dir common/craft-common-store-local publish --provenance --access public --no-git-checks
      - run: pnpm --dir common/craft-common-base publish --provenance --access public --no-git-checks
      - run: pnpm --dir common/craft-common-log publish --provenance --access public --no-git-checks
      - run: pnpm --dir capability/craft-knowledge publish --provenance --access public --no-git-checks
      - run: pnpm --dir capability/craft-memory publish --provenance --access public --no-git-checks
      - run: pnpm --dir capability/craft-experience publish --provenance --access public --no-git-checks
      - run: pnpm --dir capability/craft-codebase publish --provenance --access public --no-git-checks
      - run: pnpm publish --provenance --access public --no-git-checks
