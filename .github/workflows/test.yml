name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean distributions
        run: pnpm run clean
      - name: Build core
        run: pnpm run build:core
      - name: Build plugin bundle
        run: pnpm run build:plugin
      - name: Build DeepSeek adapter
        run: pnpm run build:deepseek
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests and 100% coverage
        run: pnpm run test:ts
      - name: CLI smoke test
        run: pnpm run test:smoke
      - name: Isolated plugin smoke test
        run: pnpm run test:plugin
