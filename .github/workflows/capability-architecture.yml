name: capability architecture anchors

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  cross-repository-anchors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: craft
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: wdx9413/craft-workbench
          ref: main
          path: craft-workbench
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: wdx9413/craft-eval
          ref: main
          path: craft-eval
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Record checked revisions
        run: |
          git -C craft rev-parse HEAD
          git -C craft-workbench rev-parse HEAD
          git -C craft-eval rev-parse HEAD
      - name: Check declared cross-repository anchors
        run: node --experimental-strip-types craft/scripts/ci/audit-capability-map.ts "$GITHUB_WORKSPACE"
