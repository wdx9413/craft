<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Craft Workbench</title>
<script>
/* Resolve the theme before the first paint so switching never flashes. */
try {
  var cached = localStorage.getItem('craft.theme');
  document.documentElement.setAttribute('data-theme', cached === 'dark' ? 'dark' : 'light');
} catch (_) { /* storage disabled — light is the shipped default */ }
</script>
<link rel="stylesheet" href="/workbench/app.css">
</head>
<body>

<div class="app" id="app" data-rail="open" data-aside="open">

  <header class="titlebar">
    <div class="tb-group tb-left">
      <button class="icon-btn" id="rail-toggle" type="button" aria-label="展开或收起侧栏">
        <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1.8"/><path d="M6.4 2.8v10.4"/></svg>
      </button>
      <button class="icon-btn" id="nav-back" type="button" aria-label="后退" title="后退">
        <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.8 3.4 5.2 8l4.6 4.6"/></svg>
      </button>
      <button class="icon-btn" id="nav-forward" type="button" aria-label="前进" title="前进">
        <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.2 3.4L10.8 8l-4.6 4.6"/></svg>
      </button>
      <span class="tb-divider" aria-hidden="true"></span>
      <div class="app-menus" aria-label="应用菜单">
        <button class="menu-btn" type="button" data-menu="file">文件</button>
        <button class="menu-btn" type="button" data-menu="edit">编辑</button>
        <button class="menu-btn" type="button" data-menu="view">视图</button>
        <button class="menu-btn" type="button" data-menu="help">帮助</button>
      </div>
    </div>

    <div class="tb-group tb-center" aria-hidden="true"></div>

    <div class="tb-group tb-right">
      <button class="icon-btn" id="aside-toggle" type="button" aria-label="展开或收起右侧信息" title="展开或收起右侧信息">
        <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1.8"/><path d="M9.6 2.8v10.4"/></svg>
      </button>
    </div>
  </header>

  <div class="workspace">

    <aside class="rail" id="rail" aria-label="主导航">
      <div class="rail-scroll">
        <!-- The app name lives here rather than in the title bar: the rail is the
             workspace, so the workspace's name belongs at its top. -->
        <div class="rail-brand">
          <span class="mark" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11.4 3.4a5.2 5.2 0 1 0 0 9.2" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
          </span>
          <span class="rb-text"><b>Craft Workbench</b><span class="rb-ver" id="brand-version"></span></span>
        </div>

        <!-- 「新建任务」 is an ordinary menu row, not a filled primary button: it
             just puts the cursor in the composer, it is not a different kind of
             action from the pages below it. -->
        <button class="nav-item" id="jump-new-task" type="button">
          <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M8 3.4v9.2M3.4 8h9.2"/></svg>
          <span class="nav-label">新建任务</span>
        </button>
        <nav class="nav" id="nav"></nav>

        <!-- Every task lives in the rail. The header carries both the fold-all
             control and the switch between folder grouping (default) and one
             flat list ordered by latest update. -->
        <div class="nav-group">
          <span>任务区 <span class="count" id="task-list-count">0</span></span>
          <span class="group-tools">
            <button class="icon-btn tiny" id="task-fold" type="button" title="全部展开或折叠" aria-label="全部展开或折叠">
              <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.8 6.3L8 3.1l3.2 3.2M4.8 9.7L8 12.9l3.2-3.2"/></svg>
            </button>
            <button class="rail-mode" id="task-view" type="button" title="现在按文件夹分组，点一下切成按更新时间倒序">按文件夹</button>
          </span>
        </div>
        <div class="folder-tree" id="folder-tree"></div>
      </div>
      <div class="rail-foot">
        <button class="nav-item" id="settings-nav" type="button">
          <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.1v1.1m0 9.6v1.1M13.9 8h-1.1M3.2 8H2.1m10.2-4.1-.8.8M4.5 11.5l-.8.8m8.6 0-.8-.8M4.5 4.5l-.8-.8"/><circle cx="8" cy="8" r="2.5"/></svg>
          <span class="nav-label">设置</span>
        </button>
        <div class="conn" id="rail-status" data-state="pending"><span class="dot"></span><span class="conn-text">连接中…</span></div>
      </div>
    </aside>

    <main class="main">
      <div class="page-head">
        <div class="ph-text">
          <h1 id="page-title">文件夹</h1>
          <p id="page-sub"></p>
        </div>
        <div class="ph-actions" id="page-actions"></div>
      </div>
      <div class="content" id="content"><div class="splash"><span class="spin" aria-hidden="true"></span>正在加载 Craft 状态…</div></div>
    </main>

    <aside class="aside" id="aside" aria-label="上下文信息">
      <!-- Contextual panel filled by the active page -->
      <div class="aside-panel" id="aside-panel"></div>
    </aside>

  </div>

  <!-- 文档 8：「正在发生」是一条细缝，默认收起，一行高。
       过程放中间等于把监工合法化，所以它只在最下面占一行，展开才看细节。 -->
  <footer class="statusbar" id="statusbar" data-open="false">
    <button class="sb-toggle" type="button" id="sb-toggle" aria-expanded="false" aria-controls="sb-detail">
      <span class="sb-caret" aria-hidden="true">▸</span>正在发生
      <span class="sb-live" id="sb-live">—</span>
    </button>
    <span class="sb-item" id="sb-conn" data-state="pending"><span class="dot"></span>连接中</span>
    <span class="sb-detail" id="sb-detail" hidden>
      <span class="sb-item" id="sb-mode">模型 未设置</span>
      <span class="sb-item" id="sb-host">任务运行 自动</span>
      <span class="sb-item mono" id="sb-root">—</span>
      <span class="sb-grow"></span>
      <span class="sb-item mono" id="sb-counts"></span>
    </span>
  </footer>

</div>

<div class="palette-host" id="palette-host" hidden></div>
<div class="toast-host" id="toast-host"></div>

<script src="/workbench/app.js"></script>
</body>
</html>
