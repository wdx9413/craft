packages:
  - adapters/deepseek-harness
  - adapters/dsh-plugin-host
  - common/craft-common-store-local
  - common/craft-common-base
  - common/craft-common-log
  - capability/craft-knowledge
  - capability/craft-memory
  - capability/craft-experience
  - capability/craft-codebase
autoInstallPeers: false
# Internal packages are built here and bundled into the distributable runtime.
linkWorkspacePackages: true
allowBuilds:
  esbuild: true
  tesseract.js: false

# Internal Craft Eval package is published to the authenticated local registry.
# Exempt only its exact version from pnpm's default release-age delay.
minimumReleaseAgeExclude:
  - craft-eval@0.1.5
