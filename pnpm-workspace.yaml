packages:
  - adapters/deepseek-harness
  - adapters/dsh-plugin-host
autoInstallPeers: false
# Sibling capabilities are consumed as npm packages, never as workspace links.
linkWorkspacePackages: false
excludeLinksFromLockfile: true
allowBuilds:
  esbuild: true
  tesseract.js: false

# Runtime dependencies are resolved by exact versions from the npm registry.
minimumReleaseAgeExclude: []
